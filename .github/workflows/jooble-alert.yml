name: Job Alert Bot (Jooble)

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours — keeps requests well under Jooble's free-tier cap
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-jooble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Jooble check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: node src/index-jooble.js

      - name: Commit updated seen-jobs store
        run: |
          git config user.name "job-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json
          git diff --staged --quiet || git commit -m "Update seen jobs store [skip ci]"
          git push
