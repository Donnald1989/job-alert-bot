name: Job Alert (RemoteOK + WWR)

# Runs every 15 minutes — these two sources have no request limit, so this
# is the "fast" schedule. Jooble and Jobicy run on a slower schedule, see
# jooble-alert.yml.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run job check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node src/index.js

      - name: Save seen-jobs store
        run: |
          git config user.name "job-alert-bot"
          git config user.email "actions@github.com"
          git add data/seen.json
          git diff --cached --quiet || git commit -m "Update seen jobs store [skip ci]"
          git push
